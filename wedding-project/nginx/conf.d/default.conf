# /root/wedding/wedding-project/nginx/conf.d/default.conf

# === HTTP: редирект на HTTPS + обработка челленджа Let's Encrypt ===
server {
    listen 80;
    server_name anton-and-nika-wedding.ru;

    # ACME-челлендж для Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://anton-and-nika-wedding.ru$request_uri;
    }
}

# === HTTPS: основной сервер ===
server {
    listen 443 ssl http2;
    server_name anton-and-nika-wedding.ru;

    # Сертификаты (пути внутри контейнера)
    ssl_certificate /etc/letsencrypt/live/anton-and-nika-wedding.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anton-and-nika-wedding.ru/privkey.pem;

    # SSL-настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Статика
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Прокси на бэкенд
    location / {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}