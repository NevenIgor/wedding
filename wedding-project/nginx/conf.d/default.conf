# /root/wedding/wedding-project/nginx/conf.d/default.conf

# === HTTP: редирект на HTTPS + обработка челленджа Let's Encrypt ===
server {
    listen 80;
    listen [::]:80;
    server_name anton-and-nika-wedding.ru;

    # ACME-челлендж для Certbot (обязательно для обновления сертификатов)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://anton-and-nika-wedding.ru$request_uri;
    }
}

# === HTTPS: основной сервер ===
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name anton-and-nika-wedding.ru;

    # 🔐 Сертификаты (пути внутри контейнера)
    ssl_certificate /etc/letsencrypt/live/anton-and-nika-wedding.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anton-and-nika-wedding.ru/privkey.pem;

    # 🔐 SSL-настройки (безопасные и современные)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 🔐 OCSP Stapling (опционально, но рекомендуется)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # 📁 1. Корень сайта — отдаём index.html
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        try_files /index.html =404;
    }

    # 📁 2. Статика: /static/ (CSS, JS, images)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # 📁 3. Остальные статические файлы (fonts, images, etc.)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 🔗 4. API-запросы — прокси на бэкенд Flask
    location /api/ {
        proxy_pass http://backend:5000;

        # Обязательные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🔹 Разрешаем все методы
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 🔹 Убираем ограничения на размер тела запроса
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # 🔹 Таймауты
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;

        # 🔹 Буферы
        proxy_buffering off;
        proxy_request_buffering off;

        # 🔹 Показываем ошибки бэкенда
        proxy_intercept_errors off;
    }

    # 🔗 5. Health check для бэкенда (если используется)
    location = /health {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ❌ 6. Всё остальное — 404 (без прокси на бэкенд)
    location / {
        return 404;
    }

    # 📄 Страницы ошибок
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}